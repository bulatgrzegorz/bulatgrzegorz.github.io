<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560">
  <title>Unfinished token: retry every chunk versus wait for a doubled prefix</title>
  <rect width="100%" height="100%" rx="18" fill="#151c27" />
  <style>text{font-family:Arial,sans-serif;fill:#e7edf5}.muted{fill:#b5c1d1}.blue{fill:#93b7fd}.green{fill:#8bd5a2}.gold{fill:#e6c384}</style>
  <text x="38" y="50" font-size="30" class="" text-anchor="start">One long string, arriving in 8 chunks</text>
  <text x="38" y="86" font-size="22" class="muted" text-anchor="start">The token stays unfinished until the last chunk.</text>
  <text x="38" y="134" font-size="22" class="" text-anchor="start">Data available</text>
  <rect x="240" y="108" width="65" height="42" rx="10" fill="#243954" stroke="#93b7fd" stroke-width="2" />
  <text x="272" y="137" font-size="22" class="blue" text-anchor="middle">1</text>
  <rect x="318" y="108" width="65" height="42" rx="10" fill="#243954" stroke="#93b7fd" stroke-width="2" />
  <text x="350" y="137" font-size="22" class="blue" text-anchor="middle">2</text>
  <rect x="396" y="108" width="65" height="42" rx="10" fill="#243954" stroke="#93b7fd" stroke-width="2" />
  <text x="428" y="137" font-size="22" class="blue" text-anchor="middle">3</text>
  <rect x="474" y="108" width="65" height="42" rx="10" fill="#243954" stroke="#93b7fd" stroke-width="2" />
  <text x="506" y="137" font-size="22" class="blue" text-anchor="middle">4</text>
  <rect x="552" y="108" width="65" height="42" rx="10" fill="#243954" stroke="#93b7fd" stroke-width="2" />
  <text x="584" y="137" font-size="22" class="blue" text-anchor="middle">5</text>
  <rect x="630" y="108" width="65" height="42" rx="10" fill="#243954" stroke="#93b7fd" stroke-width="2" />
  <text x="662" y="137" font-size="22" class="blue" text-anchor="middle">6</text>
  <rect x="708" y="108" width="65" height="42" rx="10" fill="#243954" stroke="#93b7fd" stroke-width="2" />
  <text x="740" y="137" font-size="22" class="blue" text-anchor="middle">7</text>
  <rect x="786" y="108" width="65" height="42" rx="10" fill="#243954" stroke="#93b7fd" stroke-width="2" />
  <text x="818" y="137" font-size="22" class="blue" text-anchor="middle">8</text>
  <text x="38" y="204" font-size="25" class="" text-anchor="start">Retry every chunk</text>
  <text x="38" y="240" font-size="21" class="muted" text-anchor="start">Retry at: 1, 2, 3, 4, 5, 6, 7, 8</text>
  <text x="850" y="204" font-size="22" class="muted" text-anchor="end">8 attempts</text>
  <rect x="38" y="256" width="814" height="30" rx="10" fill="#1c2634" stroke="#435168" stroke-width="2" />
  <rect x="38" y="256" width="814.0" height="30" rx="8" fill="#3e3034" stroke="#ef9a9a" stroke-width="2" />
  <text x="850" y="319" font-size="22" class="muted" text-anchor="end">36 chunk units supplied</text>
  <text x="38" y="354" font-size="25" class="" text-anchor="start">Wait for doubling</text>
  <text x="38" y="390" font-size="21" class="muted" text-anchor="start">Retry at: 1, 2, 4, 8</text>
  <text x="850" y="354" font-size="22" class="muted" text-anchor="end">4 attempts</text>
  <rect x="38" y="406" width="814" height="30" rx="10" fill="#1c2634" stroke="#435168" stroke-width="2" />
  <rect x="38" y="406" width="339.1666666666667" height="30" rx="8" fill="#243c35" stroke="#8bd5a2" stroke-width="2" />
  <text x="850" y="469" font-size="22" class="muted" text-anchor="end">15 chunk units supplied</text>
  <text x="38" y="522" font-size="22" class="gold" text-anchor="start">EOF: parse the final bytes.</text>
</svg>
