<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">An agent: the same exchange in a loop</title>
<desc id="desc">Your code sends a request with the full history and tool definitions. The model either answers or asks for tools. Requested tools run in parallel through MCP, the calls and results are appended to the history, and the next turn begins. The loop ends with a final answer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0EEE6"/></marker>
</defs>
<style>
.k{fill:#1F1E1D}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F0EEE6}
.h{font-family:Georgia,'Times New Roman',serif;font-size:30px}
.eye{font-size:13px;font-weight:700;letter-spacing:.14em;fill:#E08A6D}
.t{font-size:18px;font-weight:700}
.n{font-size:14px}
.e{font-size:13px;font-weight:600;fill:#A8A69D}
.s{font-size:15px}
.mu{fill:#A8A69D}
.iv{fill:#1F1E1D}
</style>
<rect width="1100" height="540" rx="20" fill="#1F1E1D"/>
<text x="48" y="58" class="eye">3 · AGENT</text>
<text x="48" y="98" class="h">Repeat until the model stops asking</text>

<rect x="48" y="150" width="330" height="104" rx="16" fill="#F0EEE6"/>
<text x="72" y="190" class="t iv">1  Send a request</text>
<text x="72" y="216" class="n" style="fill:#5E5D59">instructions, the full history</text>
<text x="72" y="236" class="n" style="fill:#5E5D59">and every tool definition</text>

<rect x="548" y="150" width="260" height="104" rx="16" fill="#D97757"/>
<text x="572" y="190" class="t k">2  Model decides</text>
<text x="572" y="216" class="n k">answer now, or ask for</text>
<text x="572" y="236" class="n k">one or more tools?</text>

<rect x="878" y="150" width="174" height="104" rx="16" fill="#34332F" stroke="#D97757" stroke-width="2"/>
<text x="898" y="190" class="t">Final answer</text>
<text x="898" y="216" class="n mu">assessment and</text>
<text x="898" y="236" class="n mu">customer summary</text>

<rect x="548" y="340" width="260" height="104" rx="16" fill="#788C5D"/>
<text x="572" y="380" class="t k">3  Run the tools</text>
<text x="572" y="406" class="n k">every requested call,</text>
<text x="572" y="426" class="n k">in parallel, via MCP</text>

<rect x="48" y="340" width="330" height="104" rx="16" fill="#2A2927"/>
<text x="72" y="380" class="t">4  Append to the history</text>
<text x="72" y="406" class="n mu">calls and results become</text>
<text x="72" y="426" class="n mu">part of the next request</text>

<path d="M380 202H544" stroke="#F0EEE6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="462" y="192" text-anchor="middle" class="e">request</text>
<path d="M810 202H874" stroke="#F0EEE6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="843" y="192" text-anchor="middle" class="e">no calls</text>
<path d="M678 256V336" stroke="#F0EEE6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="692" y="302" class="e">tool calls</text>
<path d="M546 392H382" stroke="#F0EEE6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="464" y="382" text-anchor="middle" class="e">results</text>
<path d="M213 338V258" stroke="#F0EEE6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="227" y="302" class="e">next turn</text>
<text x="463" y="302" text-anchor="middle" font-size="13" font-style="italic" class="mu">one lap = one model turn</text>

<text x="48" y="500" class="s mu">That loop is the whole agent. No magic, just a while loop with a budget: at most 12 model turns and 32 tool calls.</text>
</svg>
