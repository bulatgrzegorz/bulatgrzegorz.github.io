<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Auto-recovery</title>
<desc id="desc">An instance calls SetAsync while Redis is down. L1 is saved, the write to Redis fails, and the L2 write and the backplane message go into the auto-recovery queue. When Redis is back up, the queue retries them and the write succeeds.</desc>
<defs>
<marker id="yellow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f7d96f"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#83c167"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666666"/></marker>
</defs>
<style>
text{font-family:'CMU Serif','Latin Modern Roman',Charter,Georgia,'Times New Roman',serif;fill:#ececec}
.t{font-size:24px}
path,line{stroke-opacity:.65}circle{fill-opacity:.8}.g,.r,.y,.br{fill-opacity:.85}
.lane{font-size:20px;fill:#bbbbbb}
.l{font-size:18px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;fill:#58c4dd;fill-opacity:.85}
.g{fill:#83c167}.r{fill:#fc6255}.y{fill:#f7d96f}.mut{fill:#8b8b8b}
</style>
<rect width="1000" height="420" rx="18" fill="#111111"/>
<text x="40" y="56" class="t">Auto-recovery: Redis blinks, nothing gets lost</text>

<text x="40" y="151" class="lane">instance</text>
<text x="40" y="241" class="lane">recovery queue</text>
<text x="40" y="331" class="lane">Redis</text>
<line x1="230" y1="145" x2="950" y2="145" stroke="#2b2b2b" stroke-width="2"/>
<line x1="230" y1="235" x2="950" y2="235" stroke="#2b2b2b" stroke-width="2"/>

<line x1="230" y1="325" x2="420" y2="325" stroke="#83c167" stroke-width="6"/>
<line x1="420" y1="325" x2="640" y2="325" stroke="#fc6255" stroke-width="6" stroke-dasharray="12 8"/>
<line x1="640" y1="325" x2="950" y2="325" stroke="#83c167" stroke-width="6"/>
<text x="530" y="355" class="l r" text-anchor="middle">down</text>

<circle cx="460" cy="145" r="11" fill="#58c4dd"/>
<text x="460" y="116" class="m" text-anchor="middle">SetAsync("account:ada")</text>
<text x="444" y="176" class="l g" text-anchor="end">L1 saved</text>

<path d="M460 158V288" stroke="#fc6255" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
<path d="M452 296l16 16M468 296l-16 16" stroke="#fc6255" stroke-width="3"/>
<text x="446" y="270" class="l r" text-anchor="end">L2 write fails</text>

<path d="M470 154L536 216" stroke="#f7d96f" stroke-width="2.5" fill="none" marker-end="url(#yellow)"/>
<rect x="540" y="216" width="120" height="38" rx="6" fill="#f7d96f" fill-opacity=".08" stroke="#f7d96f" stroke-opacity=".6" stroke-width="2"/>
<text x="600" y="241" class="l y" text-anchor="middle">retry later</text>

<path d="M660 235C690 235 690 270 690 314" stroke="#83c167" stroke-width="2.5" fill="none" marker-end="url(#green)"/>
<path d="M704 280l6 7l12-14" stroke="#83c167" stroke-width="3" fill="none"/>
<text x="730" y="288" class="l g">retried once Redis is back</text>

<path d="M230 390H950" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#grey)"/>
<text x="950" y="412" class="l mut" text-anchor="end">time</text>
</svg>
