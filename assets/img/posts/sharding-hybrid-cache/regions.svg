<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Two regions, one home per user</title>
<desc id="desc">One Web routes calls to region eu or region us. Each region has its own AuthService, RabbitMQ, account and order shards, Redis and MongoDB. A user's data lives only in their home region's MongoDB, and a shard in the other region reads and writes it there. Between the regions sits Debezium with Kafka: both MongoDBs stream their changes into it, and it feeds them to the account and order shards of both regions.</desc>
<defs>
<marker id="web" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bbbbbb"/></marker>
<marker id="kafka" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc75cd"/></marker>
<marker id="mongo" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#699c52"/></marker>
</defs>
<style>
text{font-family:'CMU Serif','Latin Modern Roman',Charter,Georgia,'Times New Roman',serif;fill:#ececec}
.t{font-size:24px}
.n{font-size:18px}.s{font-size:14px;fill:#8b8b8b}
.region{fill:#151515;stroke:#2b2b2b;stroke-width:2;stroke-dasharray:8 8}
.rl{font-size:24px;fill:#8b8b8b}
.card{stroke-width:2;fill-opacity:.12;stroke-opacity:.5}
.e{fill:none;stroke-width:2;stroke-opacity:.4}
.web{fill:#bbbbbb;stroke:#bbbbbb}.auth{fill:#9a72ac;stroke:#9a72ac}.rabbit{fill:#ff862f;stroke:#ff862f}
.account{fill:#58c4dd;stroke:#58c4dd}.order{fill:#5cd0b3;stroke:#5cd0b3}
.redis{fill:#e65a4c;stroke:#e65a4c}.mongo{fill:#699c52;stroke:#699c52}.kafka{fill:#dc75cd;stroke:#dc75cd}
.er{stroke:#ff862f}.ed{stroke:#e65a4c}.em{stroke:#699c52}
</style>
<rect width="1000" height="500" rx="18" fill="#111111"/>
<text x="40" y="52" class="t">Two regions, one home per user</text>

<rect x="24" y="150" width="440" height="305" rx="18" class="region"/>
<rect x="536" y="150" width="440" height="305" rx="18" class="region"/>
<text x="44" y="182" class="rl">eu</text>
<text x="956" y="182" class="rl" style="text-anchor:end">us</text>

<rect x="410" y="64" width="180" height="50" rx="12" class="card web"/>
<text x="424" y="86" class="n">Web</text><text x="424" y="105" class="s">routes to a region</text>
<path d="M440 114C440 136 380 128 380 146" class="e" stroke="#bbbbbb" stroke-opacity=".6" marker-end="url(#web)"/>
<path d="M560 114C560 136 620 128 620 146" class="e" stroke="#bbbbbb" stroke-opacity=".6" marker-end="url(#web)"/>

<g>
<path d="M245 215H195" class="e er"/>
<path d="M120 240V285" class="e er"/><path d="M150 240C150 262 290 262 290 285" class="e er"/>
<path d="M105 335V380" class="e ed"/><path d="M290 335C290 357 150 357 150 380" class="e ed"/>
<path d="M150 335C150 357 290 357 290 380" class="e em"/><path d="M335 335V380" class="e em"/>
<rect x="45" y="190" width="150" height="50" rx="12" class="card rabbit"/><text x="59" y="212" class="n">RabbitMQ</text><text x="59" y="231" class="s">login fanout</text>
<rect x="245" y="190" width="150" height="50" rx="12" class="card auth"/><text x="259" y="212" class="n">AuthService</text><text x="259" y="231" class="s">JWT · logins</text>
<rect x="45" y="285" width="150" height="50" rx="12" class="card account"/><text x="59" y="307" class="n">account-N</text><text x="59" y="326" class="s">3 shards, own L1</text>
<rect x="245" y="285" width="150" height="50" rx="12" class="card order"/><text x="259" y="307" class="n">order-N</text><text x="259" y="326" class="s">3 shards, own L1</text>
<rect x="45" y="380" width="150" height="50" rx="12" class="card redis"/><text x="59" y="402" class="n">Redis</text><text x="59" y="421" class="s">L2 · backplane</text>
<rect x="245" y="380" width="150" height="50" rx="12" class="card mongo"/><text x="259" y="402" class="n">MongoDB</text><text x="259" y="421" class="s">source of truth</text>
</g>

<g>
<path d="M755 215H805" class="e er"/>
<path d="M880 240V285" class="e er"/><path d="M850 240C850 262 710 262 710 285" class="e er"/>
<path d="M895 335V380" class="e ed"/><path d="M710 335C710 357 850 357 850 380" class="e ed"/>
<path d="M850 335C850 357 710 357 710 380" class="e em"/><path d="M665 335V380" class="e em"/>
<rect x="805" y="190" width="150" height="50" rx="12" class="card rabbit"/><text x="819" y="212" class="n">RabbitMQ</text><text x="819" y="231" class="s">login fanout</text>
<rect x="605" y="190" width="150" height="50" rx="12" class="card auth"/><text x="619" y="212" class="n">AuthService</text><text x="619" y="231" class="s">JWT · logins</text>
<rect x="805" y="285" width="150" height="50" rx="12" class="card account"/><text x="819" y="307" class="n">account-N</text><text x="819" y="326" class="s">3 shards, own L1</text>
<rect x="605" y="285" width="150" height="50" rx="12" class="card order"/><text x="619" y="307" class="n">order-N</text><text x="619" y="326" class="s">3 shards, own L1</text>
<rect x="805" y="380" width="150" height="50" rx="12" class="card redis"/><text x="819" y="402" class="n">Redis</text><text x="819" y="421" class="s">L2 · backplane</text>
<rect x="605" y="380" width="150" height="50" rx="12" class="card mongo"/><text x="619" y="402" class="n">MongoDB</text><text x="619" y="421" class="s">source of truth</text>
</g>

<path d="M380 380C380 358 450 360 450 337" class="e" stroke="#dc75cd" stroke-opacity=".75" marker-end="url(#kafka)"/>
<path d="M620 380C620 358 550 360 550 337" class="e" stroke="#dc75cd" stroke-opacity=".75" marker-end="url(#kafka)"/>
<path d="M422 310H397" class="e" stroke="#dc75cd" stroke-opacity=".75" marker-end="url(#kafka)"/>
<path d="M578 310H603" class="e" stroke="#dc75cd" stroke-opacity=".75" marker-end="url(#kafka)"/>
<path d="M440 282C440 270 430 268 410 268H195C180 268 175 272 175 283" class="e" stroke="#dc75cd" stroke-opacity=".75" marker-end="url(#kafka)"/>
<path d="M560 282C560 270 570 268 590 268H805C820 268 825 272 825 283" class="e" stroke="#dc75cd" stroke-opacity=".75" marker-end="url(#kafka)"/>
<path d="M640 337C640 372 560 376 500 376S420 405 399 405" class="e" stroke="#699c52" stroke-opacity=".9" stroke-dasharray="6 5" marker-start="url(#mongo)" marker-end="url(#mongo)"/>
<text x="500" y="366" class="s" style="text-anchor:middle">home reads + writes</text>
<rect x="422" y="282" width="156" height="56" rx="12" fill="#111111"/>
<rect x="422" y="282" width="156" height="56" rx="12" class="card kafka"/>
<text x="500" y="306" class="n" style="text-anchor:middle">Debezium · Kafka</text><text x="500" y="326" class="s" style="text-anchor:middle">change feeds</text>
<text x="500" y="482" class="s" style="text-anchor:middle;font-size:16px">each user's data lives in one home MongoDB; the other region reads and writes it there, and Kafka tells it to evict</text>
</svg>
